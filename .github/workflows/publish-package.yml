name: Publish package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@mrburdeveloperteam'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm pack --ignore-scripts --json > package-manifest.json
      - run: node scripts/check-package-size.mjs package-manifest.json
      - run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
