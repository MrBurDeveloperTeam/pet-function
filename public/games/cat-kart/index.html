<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cat Kart · Town Sprint</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#254451;color:#fff3d0;font-family:system-ui}
    canvas{display:block;width:100%;height:100%}
    #loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#254451}
    h1{font-size:40px;margin:0 0 12px}p{line-height:1.7}
    button{min-height:48px;padding:12px 24px;background:#fff3d0;color:#254451;border:2px solid #d9b86b;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
    button:focus-visible{outline:3px solid #fff;outline-offset:4px}
    #desktop-only{box-sizing:border-box;width:calc(100% - 32px);max-width:360px;max-height:calc(100dvh - 32px);overflow:auto;padding:24px;border:3px solid #d9b86b;border-radius:16px;background:#203b43;color:#fff1b8;text-align:center;box-shadow:0 16px 60px #0008}
    #desktop-only::backdrop{background:rgba(10,20,24,.97)}
    #desktop-only h2{font-size:24px;margin:12px 0}
    #desktop-only .desktop-icon{font-size:48px}
    #desktop-only button{width:100%;margin-top:8px}
  </style>
</head>
<body>
  <canvas id="canvas" aria-label="Cat Kart 3D racing game"></canvas>
  <div id="loading"><h1>CAT KART</h1><p>Town Sprint · Your cat, five rivals.</p><p id="status">Preparing the track…</p><button id="retry" hidden>Try again</button></div>
  <dialog id="desktop-only" aria-labelledby="desktop-title" aria-describedby="desktop-description">
    <div class="desktop-icon" aria-hidden="true">🖥️</div>
    <h2 id="desktop-title">Desktop required</h2>
    <p id="desktop-description">Kart Racing is available on desktop only. Please open this game on a desktop or laptop computer. Mobile devices are not supported.</p>
    <button id="desktop-back" type="button" autofocus>Back to kart track</button>
  </dialog>
  <script src="/games/cat-kart/entry.js?v=desktop-only-1"></script>
</body>
</html>
