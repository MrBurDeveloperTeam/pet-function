<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paw League</title>
<style>@font-face{font-family:Quadrit;src:url(Quadrit.ttf)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#182a23;color:#fff1cb;font-family:Quadrit,monospace}canvas{display:block;width:100%;height:100%}#loading{position:fixed;inset:0;display:grid;place-content:center;background:linear-gradient(#14251b99,#14251bcc),url(stadium-pixel.png) center/cover no-repeat;z-index:5}.scene{width:min(600px,85vw);padding:28px;background:#192d25ed;border:4px solid #bca16b;box-shadow:6px 6px #332a1e}.eyebrow{letter-spacing:.3em;font-size:13px;color:#b9c8b0}h1{font-size:clamp(35px,6vw,64px);letter-spacing:.08em;margin:12px 0 28px}.pitch{position:relative;height:100px;border:2px solid #a9b496;margin-bottom:30px;background:repeating-linear-gradient(90deg,#466138 0 50px,#3d5732 50px 100px)}.pitch:before{content:'';position:absolute;height:100%;left:50%;border-left:2px solid #a9b496}.pitch:after{content:'';position:absolute;width:65px;height:65px;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid #a9b496;border-radius:50%}.meter{height:14px;border:2px solid #c4b384;padding:2px;background:#17221b}.fill{height:100%;width:0;background:#dfb254}.labels{display:flex;justify-content:space-between;font-size:13px;margin-top:14px}button{padding:12px 20px;background:#354d3b;color:#fff1cb;border:2px solid #c4b384;font:inherit;cursor:pointer}#error{max-width:550px;line-height:1.6}</style>
</head><body><canvas id="canvas" aria-label="Pixel cat football"></canvas><main id="loading"><div class="scene"><div class="eyebrow">STADIUM CLUB / 3V3</div><h1>PAW LEAGUE</h1><div class="pitch"></div><div class="meter" role="progressbar" aria-label="Loading football" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill"></div></div><div class="labels"><span id="phase">PREPARING THE PITCH</span><span id="percent">0%</span></div><p id="error" hidden></p><button id="retry" hidden>TRY AGAIN</button></div></main>
<script src="index.js"></script><script>
const engine=new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":7052920,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4}),loading=document.getElementById('loading'),meter=document.querySelector('.meter'),fill=document.querySelector('.fill'),percent=document.getElementById('percent');
document.getElementById('retry').onclick=()=>location.reload();
function fail(error){document.getElementById('phase').textContent='PITCH UNAVAILABLE';document.getElementById('error').hidden=false;document.getElementById('error').textContent='Unable to start football. A browser with WebGL 2 is required. Please retry.';document.getElementById('retry').hidden=false;parent.postMessage({source:'pet-function:stadium-football',type:'FOOTBALL_ERROR'},location.origin);console.error(error);}
if(Engine.getMissingFeatures({threads:false}).length)fail('Missing browser features');else engine.startGame({onProgress(current,total){if(total>0){const value=Math.min(99,Math.floor(current/total*100));fill.style.width=value+'%';percent.textContent=value+'%';meter.setAttribute('aria-valuenow',value);}}}).then(()=>loading.remove(),fail);
</script></body></html>
