<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paw League</title>
<style>
@font-face{font-family:Pixel;src:url('Quadrit.ttf')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#241e19}canvas{display:block;width:100%;height:100%}
#loading{position:fixed;inset:0;background:#241e19 url('loading-football-v2.png') center/cover no-repeat;color:#fff1d0;font-family:Pixel,monospace;z-index:10;isolation:isolate}
#loading:before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(24,20,16,.12) 20%,rgba(24,20,16,.15) 45%,rgba(24,20,16,.88) 100%)}
.scene{position:absolute;left:8%;bottom:10%;width:min(620px,84%)}.eyebrow{color:#dbc9a6;font-size:11px;letter-spacing:3px}h1{color:#fff1d0;font-size:clamp(30px,4vw,48px);margin:14px 0 28px;line-height:1.2;text-shadow:3px 3px 0 #39271d}.meter{position:relative;height:18px;border:2px solid #d6b87c;padding:3px;background:rgba(28,23,19,.9);box-shadow:3px 3px 0 rgba(20,15,11,.6)}.fill{height:100%;width:0;background:repeating-linear-gradient(90deg,#e8bf63 0 23px,#bb8c3e 23px 25px);transition:width .15s linear}.labels{display:flex;justify-content:space-between;gap:20px;margin-top:14px;font-size:11px;color:#e1d3b9}#error{color:#fff1d0;line-height:1.8}button{font:inherit;color:#fff1d0;background:#473428;border:2px solid #d6b87c;padding:12px 20px;cursor:pointer}button:focus-visible{outline:3px solid #fff1d0;outline-offset:4px}@media(max-height:450px){.scene{bottom:8%}h1{margin:10px 0 18px}}@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style></head><body><canvas id="canvas" width="1280" height="720" aria-label="Paw League game"></canvas>
<main id="loading"><div class="scene"><div class="eyebrow">STADIUM CLUB</div><h1>PAW LEAGUE</h1>
<div class="meter" role="progressbar" aria-label="Loading Paw League" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill"></div></div><div class="labels"><span id="phase">PREPARING THE PITCH</span><span id="percent">0%</span></div><p id="error" hidden>Unable to load the pitch. Please try again.</p><button id="retry" hidden>TRY AGAIN</button>
</div></main><noscript>Enable JavaScript to play Paw League.</noscript>
<script src="index.js"></script><script>
// Render at the actual viewport size; the scene adapts the pitch while
// preserving the cat sprites' proportions.
const engine=new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":12537344,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
const loading=document.getElementById('loading'),meter=document.querySelector('.meter'),fill=document.querySelector('.fill'),percent=document.getElementById('percent'),phase=document.getElementById('phase');
let progress=0;
document.getElementById('retry').onclick=()=>location.reload();
function fail(error){parent.postMessage({source:'pet-function:stadium-football',type:'FOOTBALL_ERROR'},location.origin);console.error(error);phase.textContent='PITCH UNAVAILABLE';document.getElementById('error').hidden=false;document.getElementById('retry').hidden=false;meter.hidden=true;percent.hidden=true;}
if(Engine.getMissingFeatures({threads:false}).length){fail('Required browser features unavailable');}else{
engine.startGame({onProgress(current,total){if(total>0){progress=Math.max(progress,Math.min(99,Math.floor(current/total*100)));fill.style.width=progress+'%';percent.textContent=progress+'%';meter.setAttribute('aria-valuenow',String(progress));if(progress>=99)phase.textContent='GETTING READY TO PLAY';}}}).then(()=>{fill.style.width='100%';meter.setAttribute('aria-valuenow','100');loading.remove();},fail);
}
</script></body></html>
