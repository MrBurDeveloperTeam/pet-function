<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Mole Game</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		@font-face{font-family:Pixel;src:url('Quadrit.ttf')}
#status{position:fixed;inset:0;background:#211610 url('loading-mine.png') center/cover no-repeat;display:block;color:#fff1d0;font-family:Pixel,monospace;isolation:isolate;z-index:10}
#status:before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(20,12,8,.05) 30%,rgba(20,12,8,.88) 100%)}
#status-splash{display:none}.loading-scene{position:absolute;left:8%;bottom:10%;width:min(620px,84%)}.eyebrow{font-size:11px;letter-spacing:3px;color:#dbc9a6}h1{font-size:clamp(30px,4vw,48px);margin:14px 0 28px;line-height:1.2;text-shadow:3px 3px #39271d}
#status-progress{position:static;display:block;width:100%;height:20px;box-sizing:border-box;border:2px solid #d6b87c;padding:3px;background:#211610;position:relative;overflow:hidden}
#status-fill{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#e8bf63 0 23px,#bb8c3e 23px 25px);transition:width .15s linear}#status-progress:after{content:"";position:absolute;inset:3px auto 3px -35%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,237,179,.8),transparent);animation:loadingSweep 1.2s linear infinite;pointer-events:none}@keyframes loadingSweep{to{left:105%}}
.loading-labels{display:flex;justify-content:space-between;margin-top:14px;font-size:11px}#status-notice{position:static;text-align:left;padding:14px 0;line-height:1.7}#retry{font:inherit;background:#473428;color:#fff1d0;border:2px solid #d6b87c;padding:12px 20px;cursor:pointer}@media(max-height:450px){.loading-scene{bottom:8%}h1{margin:10px 0 18px}}
</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<div class="loading-scene"><div class="eyebrow">GULU MINING CLUB</div><h1>MOLE HUNT</h1><div id="status-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Loading Mole Hunt"><span id="status-fill"></span></div><div class="loading-labels"><span id="loading-phase">PREPARING THE MINE</span><span id="loading-percent">0%</span></div><div id="status-notice" role="alert"></div><button id="retry" hidden onclick="location.reload()">TRY AGAIN</button></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"mainPack":"index.pck?v=godot-v11","fileSizes":{"index.pck?v=godot-v11":14421996,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
let gameReady = false;
const notifyHost = (type, details = {}) => window.parent.postMessage({ source: 'pet-function:mole-game', type, ...details }, window.location.origin);
window.addEventListener('message', (event) => {
	if (event.origin === window.location.origin && event.source === window.parent && event.data?.type === 'request-game-ready' && gameReady) notifyHost('game-ready');
});

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusFill = document.getElementById('status-fill');
	let downloadPercent = 0;

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		document.getElementById('retry').hidden = mode !== 'notice';
		document.querySelector('.loading-labels').hidden = mode === 'notice';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		notifyHost('game-error', { error: err instanceof Error ? err.message : String(err) });
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					downloadPercent = Math.max(downloadPercent, Math.min(99, Math.floor(current / total * 100)));
					statusFill.style.width = downloadPercent + '%';
					statusProgress.setAttribute('aria-valuenow', String(downloadPercent));
					document.getElementById('loading-percent').textContent = downloadPercent+'%';
					if(current>=total) document.getElementById('loading-phase').textContent='GETTING READY TO PLAY';
				} else {
					statusProgress.removeAttribute('aria-valuenow');
					document.getElementById('loading-percent').textContent = '...';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			gameReady = true;
			notifyHost('game-ready');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
